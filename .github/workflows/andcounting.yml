name: Update README Schedule

on:
  schedule:
    - cron: '00 5 * * *'
  workflow_dispatch: {}

jobs:
  update-readme-job:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run update script
        run: python update.py

      - name: Commit and push changes
        run: |
          # Configure Git with your profile info
          git config --global user.name "nitsuboy"
          git config --global user.email "${{ secrets.MAIL }}"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "docs: automated README update [skip ci]"
          git push
